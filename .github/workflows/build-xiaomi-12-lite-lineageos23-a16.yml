name: Build Moto G60 (KernelSU+SUSFS)

on:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME: "moto_g60"
  DEVICE_CODENAME: "hanoip"

  CUSTOM_CMDS: "CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE: "https://github.com/iprouteth0/kernel_motorola_hanoip"
  KERNEL_BRANCH: "master"

  CLANG_SOURCE: "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r563880c-13989888/clang-r563880c.tar.gz"
  CLANG_BRANCH: "lineage-20.0"

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/hanoip_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""

  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "xxksu"  # xxksu, rsuntk, next, resukisu, sukisu

  SUSFS_ENABLE: true
  SUSFS_FIXED: true

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "moto_g60_ksu"

  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "cyberc3dr/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "main"

  SUSFS_FOLDER_FIXED: "hanoip"
  SUSFS_PATCH_FIXED: "susfs_fix_fdc"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"
  CUSTOM_DTB: "false"
  DTB_NAME: ""

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Moto G60 (hanoip)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "CONFIG_DEBUG_KERNEL=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KALLSYMS=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KALLSYMS_ALL=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_SYSFS_SYSCALL=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_SIGNALFD=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_TIMERFD=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_EVENTFD=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_MODULES=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_MODULE_FORCE_UNLOAD=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_MODULE_UNLOAD=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_MODVERSIONS=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

      - name: Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: Build Process
        uses: ./.github/workflows/build-process

      - name: Pack Process
        uses: ./.github/workflows/pack-process

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
