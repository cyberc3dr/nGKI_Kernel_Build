name: 'Preparation for the official start of the compilation steps.'

runs:
  using: 'composite'
  steps:
      - name: Get Kernel
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE

          echo "::group::[+] Starting git clone kernel source code..."
          git clone --recursive "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_BRANCH }}" device_kernel --depth=1

          if [[ -f "device_kernel/.gitmodules" ]]; then
            cd device_kernel
            git submodule init
            git submodule update
            cd ../
            echo "[+] Detected GitModules."

          fi
          echo "::endgroup::"
          echo "[+] Kernel source code is cloned."

          # Get Kernel Version

          KERNEL_VERSION=$(head -n 3 $GITHUB_WORKSPACE/device_kernel/Makefile | grep -E 'VERSION|PATCHLEVEL' | awk '{print $3}' | paste -sd '.')
          echo "KERNEL_VERSION=$(head -n 3 device_kernel/Makefile | grep -E 'VERSION|PATCHLEVEL' | awk '{print $3}' | paste -sd '.')" >> $GITHUB_ENV
          echo "FIRST_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $1}')" >> $GITHUB_ENV
          echo "SECOND_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $2}')" >> $GITHUB_ENV

      - name: Get Kernel Arch
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          if [[ -d "arch/arm64/configs" ]]; then
            echo "KERNEL_ARCH=arm64" >> $GITHUB_ENV

          else
            echo "[-] Non-ARM64 Devies not supported!"
            false

          fi

      - name: Get Packing Tools
        shell: bash
        run: |
          # Set ${{ env.PACK_METHOD }}

          if [[ "${{ env.PACK_METHOD }}" == "Anykernel3" ]]; then
            cd $GITHUB_WORKSPACE/device_kernel

            if [[ -d "Anykernel3" ]]; then
              echo "[+] Found Anykernel3 in Kernel!"

            elif [[ "${{ env.AK3_SOURCE }}" == *"osm0sis/AnyKernel3.git" ]]; then
              git clone "${{ env.AK3_SOURCE }}" -b "${{ env.AK3_BRANCH }}" Anykernel3
              cd Anykernel3
              git checkout dca9dc370838d919d56c1f59ec78b27a14a72c68
              cd ../
              echo "[+] Get Anykernel3 successfully!"

            else
              git clone "${{ env.AK3_SOURCE }}" -b "${{ env.AK3_BRANCH }}" Anykernel3 --depth=1

            fi
          elif [[ "${{ env.PACK_METHOD }}" == "MKBOOTIMG" ]] || [ "${{ env.DEFCONFIG_FROM_BOOT }}" == "true" ]; then
            cd $GITHUB_WORKSPACE
            git clone https://android.googlesource.com/platform/system/tools/mkbootimg $GITHUB_WORKSPACE/mkboottools -b main-kernel-build-2024 --depth=1
            ${{ env.CURLX }} ${{ env.BOOT_SOURCE }} $GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img
            echo "[+] Get MKBOOTIMG successfully!"
            cd device_kernel

          else
            echo "[-] Need packing method! "
            false

          fi

          echo "PACK_METHOD=${{ env.PACK_METHOD }}" >> $GITHUB_ENV

      - name: Get DEFCONFIG
        if: env.DEFCONFIG_SOURCE != '' || env.DEFCONFIG_FROM_BOOT == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          if [[ -n "${{ env.DEFCONFIG_SOURCE }}" ]]; then
            ${{ env.CURLX }} ${{ env.DEFCONFIG_SOURCE }} device_kernel/arch/"${{ env.KERNEL_ARCH }}"/configs/${{ env.DEFCONFIG_NAME }}

          elif [[ -z "${{ env.DEFCONFIG_ORIGIN_IMAGE }}" ]]; then
            if [[ "${{ env.DEFCONFIG_FROM_BOOT }}" == "true" ]]; then
                if [[ -f "${{ env.BOOT_SOURCE }}" ]]; then
                    ${{ env.CURLX }} "${{ env.BOOT_SOURCE }}" $GITHUB_WORKSPACE/boot.img
                    $GITHUB_WORKSPACE/mkboottools/unpack_bootimg.py --boot_img $GITHUB_WORKSPACE/boot.img
                    mv $GITHUB_WORKSPACE/out/kernel $GITHUB_WORKSPACE/device_kernel/Image
                    $GITHUB_WORKSPACE/device_kernel/scripts/extract-ikconfig $GITHUB_WORKSPACE/device_kernel/Image > $GITHUB_WORKSPACE/device_kernel/arch/"${{ env.KERNEL_ARCH }}"/configs/${{ env.DEFCONFIG_NAME }}

                fi
            else
                ${{ env.CURLX }} "${{ env.DEFCONFIG_ORIGIN_IMAGE }}" $GITHUB_WORKSPACE/device_kernel/Image
                $GITHUB_WORKSPACE/device_kernel/scripts/extract-ikconfig $GITHUB_WORKSPACE/device_kernel/Image > $GITHUB_WORKSPACE/device_kernel/arch/"${{ env.KERNEL_ARCH }}"/configs/${{ env.DEFCONFIG_NAME }}

            fi
          fi

      - name: Cleaned KernelSU and Hook
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "::group::[+] Starting clean hook..."
          cp /tmp/Bin/clean_hook.sh ./
          bash clean_hook.sh
          echo "::endgroup::"
          echo "[+] Cleaned hook."

      - name: Set KernelSU
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # Function
          KERNELSU_AUTO(){
            if [[ "${{ env.KERNELSU_AUTO_FORK }}" == "xxksu" ]]; then
                KERNELSU_AUTHOR="backslashxx"
                KERNELSU_NAME="KernelSU"
                KERNELSU_ORIGIN_BRANCH="master"
                if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
                    KERNELSU_BRANCH="master"
                else
                    KERNELSU_BRANCH="master"
                fi

            elif [[ "${{ env.KERNELSU_AUTO_FORK }}" == "rsuntk" ]]; then
                KERNELSU_AUTHOR="rsuntk"
                KERNELSU_NAME="KernelSU"
                KERNELSU_ORIGIN_BRANCH="main"
                if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
                    echo "[-] ${{ env.KERNELSU_AUTO_FORK }} doesn't support SuSFS! "
                    false
                else
                    KERNELSU_BRANCH="main"
                fi

            elif [[ "${{ env.KERNELSU_AUTO_FORK }}" == "sukisu" ]]; then
                KERNELSU_AUTHOR="SukiSU-Ultra"
                KERNELSU_NAME="SukiSU-Ultra"
                KERNELSU_ORIGIN_BRANCH="main"
                if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
                    KERNELSU_BRANCH="builtin"
                else
                    KERNELSU_BRANCH="builtin"
                fi

            elif [[ "${{ env.KERNELSU_AUTO_FORK }}" == "next" ]]; then
                KERNELSU_AUTHOR="KernelSU-Next"
                KERNELSU_NAME="KernelSU-Next"
                KERNELSU_ORIGIN_BRANCH="legacy"
                if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
                    echo "[-] ${{ env.KERNELSU_AUTO_FORK }} doesn't support SuSFS! "
                    false
                else
                    KERNELSU_BRANCH="legacy"
                fi

            elif [[ "${{ env.KERNELSU_AUTO_FORK }}" == "resukisu" ]]; then
                KERNELSU_AUTHOR="ReSukiSU"
                KERNELSU_NAME="ReSukiSU"
                KERNELSU_ORIGIN_BRANCH="main"
                if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
                    KERNELSU_BRANCH="main"
                else
                    KERNELSU_BRANCH="main"
                fi

            elif [[ "${{ env.KERNELSU_AUTO_FORK }}" == "wildksu" ]]; then
                # NOTE: WildKernels/Wild_KSU repo di-archive (read-only) per
                # 3 Mei 2026 -- masih bisa dipakai apa adanya, tapi gak akan
                # ada update/fix lebih lanjut dari upstream-nya.
                KERNELSU_AUTHOR="WildKernels"
                KERNELSU_NAME="Wild_KSU"
                KERNELSU_ORIGIN_BRANCH="wild"
                if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
                    KERNELSU_BRANCH="wild"
                else
                    KERNELSU_BRANCH="wild"
                fi

            else
                echo "[-] Please input vaild fork name!"
                false

            fi

            if [[ "${{ env.KERNELSU_AUTO_FORK }}" == "next" ]]; then
                KERNELSU_FOLDER="KernelSU-Next"
                echo "KERNELSU_NAME=$KERNELSU_FOLDER" >> $GITHUB_ENV

            elif [[ "${{ env.KERNELSU_AUTO_FORK }}" == "wildksu" ]]; then
                KERNELSU_FOLDER="Wild_KSU"
                echo "KERNELSU_NAME=$KERNELSU_FOLDER" >> $GITHUB_ENV

            else
                KERNELSU_FOLDER="KernelSU"
                echo "KERNELSU_NAME=$KERNELSU_FOLDER" >> $GITHUB_ENV

            fi

            if [[ "${{ env.KERNELSU_METHOD }}" == "shell" ]]; then
                curl -sSL "https://raw.githubusercontent.com/${KERNELSU_AUTHOR}/${KERNELSU_NAME}/refs/heads/${KERNELSU_ORIGIN_BRANCH}/kernel/setup.sh" | bash -s "$KERNELSU_BRANCH"

            elif [[ "${{ env.KERNELSU_METHOD }}" == "manual" ]]; then
                git clone "https://github.com/$KERNELSU_AUTHOR/$KERNELSU_NAME.git" -b "$KERNELSU_BRANCH" "$KERNELSU_FOLDER"
                ln -sf "../$KERNELSU_FOLDER/kernel" "drivers/kernelsu"
                grep -q "kernelsu" "$GITHUB_WORKSPACE/device_kernel/drivers/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> $GITHUB_WORKSPACE/device_kernel/drivers/Makefile
                grep -q "source \"drivers/kernelsu/Kconfig\"" "$GITHUB_WORKSPACE/device_kernel/drivers/Kconfig" || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" "${GITHUB_WORKSPACE}/device_kernel/drivers/Kconfig"
                echo "[+] KernelSU Settings done."

            elif [[ "${{ env.KERNELSU_METHOD }}" == "only" ]]; then
                git clone "https://github.com/$KERNELSU_AUTHOR/$KERNELSU_NAME.git" -b "$KERNELSU_BRANCH" "$KERNELSU_FOLDER"
                ln -sf "../$KERNELSU_FOLDER/kernel" "drivers/kernelsu"

            fi
          }

          KERNELSU_MANUAL(){
            if [[ "${{ env.KERNELSU_SOURCE }}" == *Next* ]]; then
                KERNELSU_FOLDER="KernelSU-Next"
                echo "KERNELSU_NAME=$KERNELSU_FOLDER" >> $GITHUB_ENV

            else
                KERNELSU_FOLDER="KernelSU"
                echo "KERNELSU_NAME=$KERNELSU_FOLDER" >> $GITHUB_ENV

            fi

            if [[ "${{ env.KERNELSU_METHOD }}" == "shell" ]]; then
                curl -sSL "${{ env.KERNELSU_SOURCE }}" | bash -s "${{ env.KERNELSU_BRANCH }}"

            elif [[ "${{ env.KERNELSU_METHOD }}" == "manual" ]]; then
                git clone "${{ env.KERNELSU_SOURCE }}" -b "${{ env.KERNELSU_BRANCH }}" "$KERNELSU_FOLDER"
                ln -sf "../$KERNELSU_FOLDER/kernel" "drivers/kernelsu"
                grep -q "kernelsu" "$GITHUB_WORKSPACE/device_kernel/drivers/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> $GITHUB_WORKSPACE/device_kernel/drivers/Makefile
                grep -q "source \"drivers/kernelsu/Kconfig\"" "$GITHUB_WORKSPACE/device_kernel/drivers/Kconfig" || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" "${GITHUB_WORKSPACE}/device_kernel/drivers/Kconfig"
                echo "[+] KernelSU Settings done."

            elif [[ "${{ env.KERNELSU_METHOD }}" == "only" ]]; then
                git clone "${{ env.KERNELSU_SOURCE }}" -b "${{ env.KERNELSU_BRANCH }}" "$KERNELSU_FOLDER"
                ln -sf "../$KERNELSU_FOLDER/kernel" "drivers/kernelsu"

            fi
          }


          # Core
          if [[ ${{ env.KERNELSU_AUTO_GET }} == "true" ]]; then
            KERNELSU_AUTO

          else
            KERNELSU_MANUAL

          fi
          echo "KERNELSU_METHOD=${{ env.KERNELSU_METHOD }}" >> $GITHUB_ENV

      - name: ReSukiSU Upstream Compat Fixup
        # Ditemukan lewat perbandingan sama CI lain (KonToLKzuu, branch
        # v7-susfs220) yang sukses boot normal pakai ReSukiSU di kernel
        # camellia yang sama, sedangkan kita kena kernel panic sedini
        # sebelum bootanim. Bedanya BUKAN di hook method (kita berdua sama-
        # sama pakai SuSFS Inline Hook), tapi: mereka nge-pin 1 commit
        # ReSukiSU yang spesifik (bukan `main` branch mentah-mentah) DAN
        # nambal beberapa identifier/declaration yang ternyata hilang di
        # source ReSukiSU pada commit itu (extern ksu_cred, backup_policydb/
        # backup_sidtab/ksu_late_loaded di selinux_hide.c, ksu_no_custom_rc
        # di ksud_integration.c, SUSFS_MAGIC di supercall.c). Yang kayak
        # gini biasanya gak bikin compile ERROR (implicit-declaration cuma
        # warning), tapi bisa bikin runtime UB/crash -- persis gejala kamu.
        # Diporting apa adanya dari setup-ksu/action.yml mereka.
        if: env.KERNELSU_AUTO_FORK == 'resukisu' || contains(env.KERNELSU_SOURCE, 'ReSukiSU')
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # drivers/kernelsu itu symlink -> <repo ReSukiSU>/kernel. Cari akar
          # repo-nya (yang punya folder .git) buat keperluan git pin commit.
          KSU_LINK_TARGET="$(readlink -f drivers/kernelsu)"
          KSU_REPO_DIR="$(dirname "$KSU_LINK_TARGET")"
          if [ ! -d "$KSU_REPO_DIR/.git" ]; then
            KSU_REPO_DIR="$(dirname "$KSU_REPO_DIR")"
          fi

          if [ ! -d "$KSU_REPO_DIR/.git" ]; then
            echo "[-] [resukisu-fixup] Gak nemu root repo ReSukiSU (.git), dilewatin."

          else
            cd "$KSU_REPO_DIR"
            echo "[+] [resukisu-fixup] Repo root: $KSU_REPO_DIR"

            # --- Pin ke commit yang udah terbukti stabil di kernel ini ---
            PINNED_COMMIT="cdce8bb8c8bf2167d21751e39ca6cdc4ad154678"
            KSU_ABI_VERSION=35079
            git fetch --unshallow origin main 2>/dev/null || git fetch origin main
            git fetch origin "$PINNED_COMMIT"
            git checkout --detach "$PINNED_COMMIT"
            test "$(git rev-parse HEAD)" = "$PINNED_COMMIT" || {
              echo "::error::ReSukiSU commit pin mismatch"; exit 1;
            }
            echo "[+] [resukisu-fixup] Pinned to $PINNED_COMMIT"

            # --- Sinkronisasi folder UAPI ---
            mkdir -p kernel/uapi kernel/policy/uapi include/uapi 2>/dev/null || true
            cd "$GITHUB_WORKSPACE/device_kernel"
            find "$KSU_REPO_DIR/" drivers/kernelsu/ -type d -name "uapi" 2>/dev/null | while read -r ufolder; do
              cp -rf "$ufolder"/* drivers/kernelsu/uapi/ 2>/dev/null || true
              cp -rf "$ufolder"/* drivers/kernelsu/policy/uapi/ 2>/dev/null || true
              cp -rf "$ufolder"/* include/uapi/ 2>/dev/null || true
            done

            # --- Pasangkan ABI kernel-side sama build ReSukiSU 4.2 (35079) ---
            if [ -f "drivers/kernelsu/Kbuild" ]; then
              sed -i '/-DKERNEL_SU_VERSION=/d' drivers/kernelsu/Kbuild
              sed -i "1iccflags-y += -I\$(srctree)/drivers/kernelsu -I\$(srctree)/drivers/kernelsu/include -DKERNEL_SU_VERSION=$KSU_ABI_VERSION" drivers/kernelsu/Kbuild
              sed -i -E "s/^[[:space:]]*KSU_VERSION[[:space:]]*:=.*/KSU_VERSION := $KSU_ABI_VERSION/" drivers/kernelsu/Kbuild
              printf '%s\n' "ccflags-y += -DKSU_VERSION=$KSU_ABI_VERSION -DKERNEL_SU_VERSION=$KSU_ABI_VERSION" >> drivers/kernelsu/Kbuild
            fi
            if [ -f "drivers/kernelsu/Makefile" ]; then
              sed -i '/-DKERNEL_SU_VERSION=/d' drivers/kernelsu/Makefile
              sed -i "1iccflags-y += -I\$(srctree)/drivers/kernelsu -I\$(srctree)/drivers/kernelsu/include -DKERNEL_SU_VERSION=$KSU_ABI_VERSION" drivers/kernelsu/Makefile
              sed -i -E "s/^[[:space:]]*KSU_VERSION[[:space:]]*:=.*/KSU_VERSION := $KSU_ABI_VERSION/" drivers/kernelsu/Makefile
            fi

            # --- Embed marker ABI (dipakai buat cross-check versi runtime) ---
            CORE_INIT="drivers/kernelsu/core/init.c"
            if [ -f "$CORE_INIT" ] && ! grep -q "resukisu_kernel_abi_${KSU_ABI_VERSION}" "$CORE_INIT"; then
              sed -i "1i__attribute__((used, section(\".rodata\"))) static const char resukisu_kernel_abi_${KSU_ABI_VERSION}[] = \"ReSukiSU-KERNEL-ABI-${KSU_ABI_VERSION}\";" "$CORE_INIT"
            fi

            # --- extern ksu_cred yang ilang di beberapa file .c ---
            find drivers/kernelsu/ -type f -name "*.c" | while read -r file; do
              if grep -q "ksu_cred" "$file" && ! grep -q "struct cred \*ksu_cred" "$file" && ! grep -q "extern.*ksu_cred" "$file"; then
                echo "  -> [resukisu-fixup] Injecting extern ksu_cred into $file"
                sed -i '1istruct cred;\nextern struct cred *ksu_cred;' "$file"
              fi
            done

            # --- selinux_hide.c: identifier SELinux yang ilang ---
            SELINUX_HIDE_FILE="drivers/kernelsu/feature/selinux_hide.c"
            if [ -f "$SELINUX_HIDE_FILE" ]; then
              sed -i '1i#include <linux/types.h>\nstruct policydb;\nstruct sidtab;\nextern struct policydb *backup_policydb;\nextern struct sidtab *backup_sidtab;\nextern bool ksu_late_loaded;' "$SELINUX_HIDE_FILE"

              if ! grep -q "^struct policydb \*backup_policydb" "$SELINUX_HIDE_FILE" && ! grep -rq "struct policydb \*backup_policydb" drivers/kernelsu/selinux/ 2>/dev/null; then
                echo "struct policydb *backup_policydb = NULL;" >> "$SELINUX_HIDE_FILE"
                echo "struct sidtab *backup_sidtab = NULL;" >> "$SELINUX_HIDE_FILE"
              fi

              if ! grep -rq "ksu_late_loaded" drivers/kernelsu/core/ 2>/dev/null; then
                echo "bool ksu_late_loaded = false;" >> "$SELINUX_HIDE_FILE"
              fi
              echo "[+] [resukisu-fixup] Patched selinux_hide.c missing identifiers."
            fi

            # --- ksud_integration.c: identifier runtime yang ilang + jadwalin ksud install ---
            KSUD_FILE="drivers/kernelsu/runtime/ksud_integration.c"
            if [ -f "$KSUD_FILE" ]; then
              python3 "$GITHUB_WORKSPACE/.github/scripts/add_ksud_install_rc.py" "$KSUD_FILE" || true

              sed -i '1i#include <linux/types.h>\nextern bool ksu_no_custom_rc;\nextern bool ksu_late_loaded;' "$KSUD_FILE"

              if ! grep -rq "bool ksu_no_custom_rc" drivers/kernelsu/ 2>/dev/null; then
                echo "bool ksu_no_custom_rc = false;" >> "$KSUD_FILE"
              fi
              if ! grep -rq "bool ksu_late_loaded" drivers/kernelsu/ 2>/dev/null; then
                echo "bool ksu_late_loaded = false;" >> "$KSUD_FILE"
              fi
              echo "[+] [resukisu-fixup] Patched ksud_integration.c missing identifiers."
            fi

            # --- supercall.c: SUSFS_MAGIC yang ilang ---
            SUPERCALL_FILE="drivers/kernelsu/supercall/supercall.c"
            if [ -f "$SUPERCALL_FILE" ]; then
              sed -i '1i#include <linux/types.h>\n#include <linux/susfs_def.h>\n#ifndef SUSFS_MAGIC\n#define SUSFS_MAGIC 0xA5A5A5A5\n#endif' "$SUPERCALL_FILE"
              echo "[+] [resukisu-fixup] Patched supercall.c SUSFS_MAGIC."
            fi

            # --- dispatch.c: marker ABI + jangan dobel define command ABI SUSFS ---
            DISPATCH_FILE="drivers/kernelsu/supercall/dispatch.c"
            if [ -f "$DISPATCH_FILE" ]; then
              sed -i "1i__attribute__((used, section(\".rodata\"))) static const unsigned int resukisu_kernel_abi_version = ${KSU_ABI_VERSION};\n#include <linux/types.h>\n#include <linux/susfs_def.h>\n#ifndef KERNEL_SU_VERSION\n#define KERNEL_SU_VERSION ${KSU_ABI_VERSION}\n#endif\nextern bool ksu_late_loaded;" "$DISPATCH_FILE"
            fi
            rm -f drivers/kernelsu/include/linux/susfs_def.h

            echo "[+] [resukisu-fixup] Selesai."
          fi

      - name: SukiSU-Ultra Fixed
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/drivers/kernelsu

          if [[ "${{ env.KERNELSU_SOURCE }}" == *SukiSU* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "sukisu" ]]; then
            cp /tmp/Patches/Patch/sukisu_ultra_fixed.patch ./
            patch -p1 < sukisu_ultra_fixed.patch

            echo "[+] SukiSU-Ultra mitigation measures implemented."

          else
            echo "[-] Your KernelSU Fork needn't it, Skipped."

          fi

      - name: xxksu add SuSFS
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/KernelSU

          if [[ "${{ env.KERNELSU_SOURCE }}" == *backslashxx* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "xxksu" ]]; then
            if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
              cp /tmp/Patches/Patch/xxksu_implement_susfs.patch ./
              patch -p1 < xxksu_implement_susfs.patch

              echo "[+] xxksu susfs applied."
            fi
            
          else
            echo "[-] Your KernelSU Fork needn't it, Skipped."

          fi

      - name: KPM Function Support
        if: env.KPM_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          ENABLE_KPM_CONFIGS(){
            sed -n '/^config KALLSYMS_ALL/,/^[^ \t]/p' init/Kconfig | grep -q 'depends on.*DEBUG_KERNEL' && echo "CONFIG_DEBUG_KERNEL=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo "CONFIG_KALLSYMS=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo "CONFIG_KALLSYMS_ALL=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          }

          GET_KPM_TOOLS(){
            echo "[+] Detected set_memory."
            echo "CONFIG_KPM=y" >> ./arch/"${{ env.KERNEL_ARCH }}"/configs/${{ env.DEFCONFIG_NAME }}
            ${{ env.CURLX }} "${{ env.KPM_PATCH_SOURCE }}" patch

            if [ -f "patch" ]; then
                chmod a+x patch
                echo "[+] Get KPM Tools successfully !"
            else
                echo "[-] Get KPM Tools failed !"
                false
            fi

          }

          GET_KPATCH_NEXT_TOOLS(){
            REPO="KernelSU-Next/KPatch-Next"
            ${{ env.CURLX }} "https://github.com/$REPO/releases/latest/download/kpimg-linux" kpimg-linux
            ${{ env.CURLX }} "https://github.com/$REPO/releases/latest/download/kptools-linux" kptools-linux

            if [ -f "kptools-linux" ]; then
                chmod a+x kptools-linux
                echo "[+] Get KPatch-Next Tools successfully !"
            else
                echo "[-] Get KPatch-Next Tools failed !"
                false
            fi

          }

          if [[ "${{ env.KERNELSU_SOURCE }}" == *SukiSU* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "sukisu" ]] && [[ "${{ env.KPM_INLINE }}" == "true" ]]; then
            echo "[+] Detected SukiSU-Ultra and enabled KPM Inline."
            ENABLE_KPM_CONFIGS

            if [ -f "include/linux/set_memory.h" ]; then
                GET_KPM_TOOLS

            else
                cp /tmp/Patches/Patch/set_memory_to_49_and_low.patch ./
                patch -p1 < set_memory_to_49_and_low.patch || true
                echo "[+] Patch set_memory successfully !"
                echo "[-] If have patch error (.rej), manual fixed it."
                GET_KPM_TOOLS

            fi

          elif [[ "${{ env.KERNELSU_SOURCE }}" != *SukiSU* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" != "sukisu" ]] && [[ "${{ env.KPM_INLINE }}" == "true" ]]; then
            echo "[-] Your KernelSU Fork could not support KPM Inline!"
            false

          elif [[ "${{ env.KPM_KPATCH_NEXT }}" == "true" ]]; then
            GET_KPATCH_NEXT_TOOLS

          else
            ENABLE_KPM_CONFIGS
            echo "[+] Necessary configuration items have been enabled for the KPM feature."

          fi

      - name: Set KSU and SUSFS for DEFCONFIG
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # Neccssary
          echo "CONFIG_KSU=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          # Fork
          if [[ "${{ env.KERNELSU_SOURCE }}" == *rsuntk* ]] || [[ "${{ env.KERNELSU_SOURCE }}" == *Next* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "rsuntk" ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "next" ]] || [[ "${{ env.KERNELSU_SOURCE }}" == *ReSukiSU* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "resukisu" ]]; then
            if [[ ${{ env.SUSFS_ENABLE }} != "true" ]]; then
                echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

            fi
          fi

          if [[ "${{ env.KERNELSU_SOURCE }}" == *SukiSU* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "sukisu" ]] || [[ "${{ env.KERNELSU_SOURCE }}" == *ReSukiSU* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "resukisu" ]]; then
            if [[ "${{ env.SUSFS_ENABLE }}" != "true" ]]; then
                echo "CONFIG_KSU_SUSFS=n" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

            elif [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
                echo "CONFIG_KSU_SUSFS=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            fi
          fi

          if [[ "${{ env.KERNELSU_SOURCE }}" == *Next* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "next" ]]; then
            if [ "${{ env.FIRST_VERSION }}" -lt 5 ] && [ "${{ env.SECOND_VERSION }}" -lt 10 ]; then
                echo "CONFIG_KSU_ALLOWLIST_WORKAROUND=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            fi
          fi
