name: Build and Release Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      build-kernel:
        description: 'Build Kernel ?'
        required: true
        type: boolean
        default: true

      release-kernel:
        description: 'Release Kernel ?'
        required: true
        type: boolean
        default: true

  schedule:
    - cron: '0 3 * * 3'

jobs:
  build-kernel:
    name: "Step Build Kernel"
    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    strategy:
      fail-fast: true
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build-kernel == true)

  release-kernel:
    name: "Step Release Kernel"
    runs-on: ubuntu-24.04
    needs:
      - build-kernel
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release-kernel == true)
    env:
      REPO_OWNER: cyberc3dr
      REPO_NAME: nGKI_Kernel_Build
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: "Pre-built"
      RELEASE_NOTES: |
        Below is the codename reference table. Please select the image or archive you need based on this table.

        | Device Name | Codename | Kernel | System | Android | Method | KernelSU | SUSFS | Re:Kernel | BBG | NoMount | VPNHide | fgetpriority |
        |----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|
        | Xiaomi 12 Lite | taoyao | 5.4 | LineageOS 23.2 | 16 | Anykernel3 | xxKSU | ✅ | ❌ | ✅ | ✅ | ✅ | ✅ |
        | Poco X5 5G | moonstone | 5.4 | LineageOS 23.2 | 16 | Anykernel3 | xxKSU | ✅ | ❌ | ✅ | ✅ | ✅ | ✅ |
        | Nothing Phone (1) | spacewar | 5.4 | Evolution X 11.10 | 16 | Anykernel3 | xxKSU | ✅ | ❌ | ✅ | ❌ | ✅ | ✅ |
        | Nothing Phone (1) | spacewar | 5.4 | LineageOS 24.0 | 17 | Anykernel3 | xxKSU | ✅ | ❌ | ✅ | ✅ | ✅ | ✅ |
        | Nothing Phone (1) | spacewar | 5.4 | Nothing OS 3.2 | 15 | Anykernel3 | xxKSU | ✅ | ❌ | ✅ | ✅ | ✅ | ✅ |
        | Nothing Phone (1) | spacewar | 5.4 | Nothing OS 5.0 | 17 | Anykernel3 | xxKSU | ✅ | ❌ | ✅ | ✅ | ✅ | ✅ |
        | Nothing Phone (1) | spacewar | 5.4 | PixelOS | 17 | Anykernel3 | xxKSU | ✅ | ❌ | ✅ | ✅ | ✅ | ✅ |

        - Specific device information: [Supported List](Supported_list.md).
        - The KernelSU version is for reference only. It is normal for the KernelSU version embedded in SUSFS to be lower.

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v6

      # Download Artifacts
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true

      # Get the Latest Tag from GitHub
      - name: Generate and Create New Tag
        run: |
          # Fetch the latest tag from GitHub (this is the latest tag based on the GitHub API)
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name')
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0000000001" # if have no any releases.
          fi

          NEW_TAG=$(date +%s)

          # Output the new tag to be used
          echo "New tag: $NEW_TAG"

          # Set the new tag as an environment variable to be used in later steps
          TIME=$(date +"%Y-%m-%d %H:%M")
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

          # Create the tag in the repository
          git tag $NEW_TAG
          git push --tags

          # Get KernelSU version
          git clone -b master https://github.com/backslashxx/KernelSU.git KernelSU-xxksu
          KSU_XXKSU_VERSION=$(cd KernelSU-xxksu && expr $(/usr/bin/git rev-list --count HEAD) + 30000 - 80)
          git clone -b master https://github.com/KOWX712/KernelSU.git KernelSU-KowSU
          KSU_KOWSU_VERSION=$(cd KernelSU-KowSU && expr $(/usr/bin/git rev-list --count HEAD) + 30000)
          git clone -b main https://github.com/Baka-SU/BakaSU.git KernelSU-BakaSU
          KSU_RESUKISU_VERSION=$(cd KernelSU-BakaSU && expr $(/usr/bin/git rev-list --count HEAD) + 30000 + 700)

          # Input release note
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "[KernelSU-KowSU](https://t.me/kowsu_build) Version: $KSU_KOWSU_VERSION  " >> $GITHUB_ENV
          echo "[KernelSU-xxksu](https://github.com/backslashxx/KernelSU/releases) Version: $KSU_XXKSU_VERSION  " >> $GITHUB_ENV
          echo "[KernelSU-BakaSU](https://github.com/Baka-SU/BakaSU) Version: $KSU_RESUKISU_VERSION  " >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Create GitHub Release and upload files if make_release is true
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: false
          release_name: "${{ env.RELEASE_NAME }} ${{ env.TIME }}"
          body: ${{ env.RELEASE_NOTES }}

      - name: Upload Release Assets Dynamically
        run: |
          # Loop through all files in the downloaded-artifacts directory
          for file in ./downloaded-artifacts/*; do
              # Skip directories
              if [ -d "$file" ]; then
                  continue
              fi

              # Upload the file to the GitHub release
              echo "Uploading $file..."
              gh release upload ${{ env.NEW_TAG }} "$file"
          done

      # Display Files Uploaded
      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/*
