name: 'Patch VPNHide for Kernel.'

runs:
  using: 'composite'
  steps:
      - name: Patch VPNHide
        if: env.VPNHIDE_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          git clone https://github.com/soranerai/vpnhide_next_backend /tmp/vpnhide

          chmod +x /tmp/vpnhide/kpatch/scripts/apply.sh

          if [[ "${{ env.KERNEL_VERSION }}" == "5.4" ]]; then
            echo "[+] Detected kernel 5.4"
            /tmp/vpnhide/kpatch/scripts/apply.sh . android12-5.4
            echo "CONFIG_VPNHIDE=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo "[+] Patched VPNHide for your kernel 5.4 successfully."
          elif [[ "${{ env.KERNEL_VERSION }}" == "4.19" ]]; then
            echo "[+] Detected kernel 4.19"
            /tmp/vpnhide/kpatch/scripts/apply.sh . upstream-4.19
            echo "CONFIG_VPNHIDE=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo "[+] Patched VPNHide for your kernel 4.19 successfully."
          elif [[ "${{ env.KERNEL_VERSION }}" == "4.14" ]]; then
            echo "[+] Detected kernel 4.14"
            /tmp/vpnhide/kpatch/scripts/apply.sh . upstream-4.14
            echo "CONFIG_VPNHIDE=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo "[+] Patched VPNHide for your kernel 4.14 successfully."
          else
            echo "[-] Your kernel doesn't support this feature"
          fi
