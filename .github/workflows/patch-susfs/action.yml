name: 'Patch SuSFS for Kernel.'

runs:
  using: 'composite'
  steps:
      - name: Get SuSFS
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # Core
          if [[ "${{ env.SUSFS_FIXED }}" == true ]]; then
            if [ -z "${{ env.PATCHES_SOURCE }}" ] || [ -z "${{ env.PATCHES_BRANCH }}" ]; then
              echo "[-] Please input a vaild source and branch!"
              false

            elif [[ "${{ env.PATCHES_SOURCE }}" == *".git" ]]; then
              echo "[-] Please do not set a full URL in PATCH_SOURCE!"
              false

            else
              git clone https://github.com/${{ env.PATCHES_SOURCE }}.git -b ${{ env.PATCHES_BRANCH }} NonGKI_Kernel_Patches --depth=1 # It's not necessary.

            fi

          fi

      - name: Set KSU and SUSFS for DEFCONFIG
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "CONFIG_KSU_SUSFS=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          if grep -q "THREAD_INFO_IN_TASK" "drivers/kernelsu/Kconfig"; then
            echo "CONFIG_THREAD_INFO_IN_TASK=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          fi

      - name: Patch SuSFS
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          SUSFS_VERSION="2.2.00"

          PACK_FILES(){
            temp_dir=$(mktemp -d)
            find . -name "*.rej" -exec cp --parents {} "$temp_dir" \;
            find . -name "*.rej" | sed 's/\.rej$//' | xargs -I {} test -f {} && find . -name "*.rej" | sed 's/\.rej$//' | xargs -I {} cp --parents {} "$temp_dir"
            tar -czf "rej_files_1.5.5.tar.gz" -C "$temp_dir" .
            rm -rf "$temp_dir"
            echo "[+] Packed Successfully."

            find . -type f \( -name "*.rej" -o -name "*.orig" \) -delete
            echo "[+] Removed all .rej and .orig files."
            echo "[+] =================================== "

          }

          # Check SuSFS
          if grep -q "CONFIG_KSU_SUSFS" "fs/namespace.c"; then
            echo "[-] SuSFS is already patched, Skipped."
            echo "SUSFS_SKIP=true" >> $GITHUB_ENV

          else
            cp /tmp/Patches/Patch/susfs_patch_to_${{ env.KERNEL_VERSION }}.patch ./

            patch -p1 < susfs_patch_to_${{ env.KERNEL_VERSION }}.patch || true
            echo "[+] SuSFS Patch completed."

          fi

          # --- Camellia (redmi_note10_5g) fork compat fixup ---
          # fs/proc/task_mmu.c di cristidclxvi/android_kernel_xiaomi_camellia
          # sudah cukup direstruktur (offset hunk s.d. -53/+36 baris) sampai
          # susfs_patch_to_4.14.patch gak nempel bersih. Efeknya, sesuai .rej
          # yang ketangkep run sebelumnya:
          #  1) Hunk #1 (include <linux/susfs_def.h> terguard) GAGAL apply --
          #     dibutuhin karena dipakai hunk lain, jadi di-insert ulang di
          #     sini secara manual, ditaruh sebelum "#include <asm/elf.h>"
          #     (baris yang hampir pasti selalu ada apa adanya).
          #  2) Hunk #5 & #6 GAGAL apply, tapi isinya cuma kosmetik (hapus/
          #     tambah baris kosong) -- aman diabaikan, gak pengaruh compile.
          #  3) Hunk #4 (nambah cek SUSFS_IS_INODE_SUS_MAP + "return 0;")
          #     dilaporin SUKSES, tapi context-match-nya kelewat longgar
          #     (fuzz 2, offset -53) jadi nyasar ke-insert ke dalam
          #     smap_gather_stats() yang return-type-nya void, bukan ke
          #     show_smap() (int) kayak yang dimaksud upstream. Ini penyebab
          #     asli error compile "void function 'smap_gather_stats' should
          #     not return a value" -- dan gak kelihatan di .rej karena
          #     hunk-nya dianggap "sukses", cuma salah tempat.
          if [[ "${{ env.DEVICE_CODENAME }}" == "camellia" ]] && [ -f "fs/proc/task_mmu.c" ]; then
            if ! grep -q "linux/susfs_def.h" fs/proc/task_mmu.c && grep -q "#include <asm/elf.h>" fs/proc/task_mmu.c; then
              perl -0777 -pi -e 's/(#include <asm\/elf\.h>)/#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux\/susfs_def.h>\n#endif\n\n$1/' fs/proc/task_mmu.c
              echo "[+] [camellia-fixup] Re-inserted missing susfs_def.h include."
            fi

            if grep -Pzoq "if \(vma->vm_file && SUSFS_IS_INODE_SUS_MAP\(file_inode\(vma->vm_file\)\)\)\n\t\treturn 0;" fs/proc/task_mmu.c; then
              perl -0777 -pi -e 's/(if \(vma->vm_file && SUSFS_IS_INODE_SUS_MAP\(file_inode\(vma->vm_file\)\)\)\n\t\t)return 0;/${1}return;/' fs/proc/task_mmu.c
              echo "[+] [camellia-fixup] Fixed stray 'return 0;' inside void smap_gather_stats()."
            fi

            rm -f fs/proc/task_mmu.c.rej
            echo "[+] [camellia-fixup] task_mmu.c.rej cleared (hunks #1/#5/#6 already handled or cosmetic)."
          fi

          # Patch .rej find
          if [[ "${{ env.BUILD_DEBUGGER }}" == "true" ]]; then
            echo "[+] Checking SuSFS v${SUSFS_VERSION} rej files..."
            mapfile -t REJ_FILES < <(find . -type f -name "*.rej")

            if [ ${#REJ_FILES[@]} -eq 0 ]; then
                echo "[+] Your kernel have no any rej files, Skipped."

            else
                for CAT_REJ in "${REJ_FILES[@]}"; do
                    echo "[-] Found .rej file: $CAT_REJ"
                    cat $CAT_REJ
                    echo "[+] =================================== "
                done

            fi

            # Bug asli: cabang di bawah ini gak pernah ngecek jumlah
            # REJ_FILES, cuma ngecek SKIP_PATCH/SUSFS_PATCH_FIXED -- jadi
            # build tetap di-stop ("Found .rej files, Stopped!") walaupun
            # REJ_FILES kosong. Sekarang digembok dengan syarat REJ_FILES
            # beneran ada isinya dulu.
            if [ ${#REJ_FILES[@]} -eq 0 ]; then
                echo "[+] SuSFS Patch Version: v${SUSFS_VERSION}. "
                echo "[+] No rej files found, continuing build normally."
                PACK_FILES

            elif [[ "${{ env.SKIP_PATCH }}" == "true" ]] || [ -n "${{ env.SUSFS_PATCH_FIXED }}" ]; then
                echo "[+] SuSFS Patch Version: v${SUSFS_VERSION}. "
                echo "[+] SKIP_PATCH enabled or found SuSFS v2.2.00 Fixed Patch, skipping."
                PACK_FILES

            else
                echo "[+] SuSFS Patch Version: v${SUSFS_VERSION}. "
                echo "[-] Found .rej files, Stopped! "
                PACK_FILES
                false

            fi

          fi

      - name: SUSFS Patch Fixed
        if: env.SUSFS_ENABLE == 'true' && env.SUSFS_SKIP != 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          if [[ -z "${{ env.SUSFS_PATCH_FIXED }}" ]]; then
            echo "[-] You didn't provide any patch file."

          else
            IFS=',' read -ra FIXED_LIST <<< "${{ env.SUSFS_PATCH_FIXED }}"
            echo "[+] =================================== "
            for i in "${!FIXED_LIST[@]}"; do
              echo "Patching -> ${FIXED_LIST[$i]}"

              if [[ -z "${{ env.SUSFS_FOLDER_FIXED }}" ]]; then
                cp NonGKI_Kernel_Patches/${FIXED_LIST[$i]}.patch ./

              else
                cp NonGKI_Kernel_Patches/"${{ env.SUSFS_FOLDER_FIXED }}"/${FIXED_LIST[$i]}.patch ./

              fi

              patch -p1 < ${FIXED_LIST[$i]}.patch || true
              echo "[+] Patching successful!"
              echo "[+] =================================== "
            done

          fi

      - name: Upload Build Patch Rejected Files
        if: env.BUILD_DEBUGGER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patch_rejected_files
          path: |
            device_kernel/rej_files_*
